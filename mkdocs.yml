site_name: Technical Writer CV
site_description: Примеры технической документации и спецификаций
site_author: Technical Writer

theme:
  name: material
  language: ru
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Переключить на темную тему
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Переключить на светлую тему
  features:
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - swagger-ui-tag

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - tables
  - admonition

nav:
  - Главная: index.md
  - REST API:
      - Руководство разработчика: api/api-developer.md
      - Спецификация: api/reference.md
  - Интеграции и Протоколы:
      - HL7 Workflow: integrations/hl7-workflow.md
      - Stripe Payment Integration: integrations/stripe-workflow.md
  - Руководства пользователя:
      - Настройка Fee Schedules: guides/fee-schedule-setup.md